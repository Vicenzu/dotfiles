[manager]
ratio          = [1, 4, 3]   # proporzioni pannelli: genitori | lista | preview
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
show_hidden    = false

[preview]
tab_size   = 2
max_width  = 600
max_height = 900

[opener]
edit = [
  { run = '$EDITOR "$@"', block = true },
]

[open]
rules = [
  { mime = "text/*",        use = "edit" },
  { mime = "application/json", use = "edit" },
]
