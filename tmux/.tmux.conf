# ======= CONFIGURAZIONI GENERALI =======
unbind r
bind r source-file ~/.tmux.conf \; display-message "Reloaded..."

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

set -g prefix C-s
set -g mouse on
set -g default-terminal "tmux-256color"
set-option -g status-position bottom
set -g status-interval 5

# Vim motion panels
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind -r m resize-pane -Z

unbind v
bind v copy-mode

# ======= LISTA PLUGIN =======
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ======= 1. CONFIGURA CATPPUCCIN =======
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# ⚠️ RIGHE CUSTOM RIMOSSE PER NON ROMPERE L'ESPANSIONE DI CATPPUCCIN ⚠️

# Carica Catppuccin PRIMA della barra
run ~/.tmux/plugins/tmux/catppuccin.tmux

# ======= 2. DISEGNA LA BARRA (Con i flag -F) =======
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_session}"

# ======= 3. AVVIA TPM =======
run '~/.tmux/plugins/tpm/tpm'

# ======= ALTRE OPZIONI =======
set-option -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY GPG_AGENT_INFO DBUS_SESSION_BUS_ADDRESS"
set -g allow-passthrough on
set -ga update-environment TERM
set -g visual-activity off
